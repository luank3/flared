version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    # cloudflared is the tunnel protocol implementation and is bumped deliberately (see README),
    # so it is excluded from automated dependency updates.
    ignore:
      - dependency-name: "github.com/cloudflare/cloudflared"
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
